# systemd-tmpfiles: the two shared filesystem objects, and only these.
#
# ONE lock inode. flock is per inode, so provisioning the legacy
# /tmp/queue-forecasting-walk-forward.lock as a second regular file would create
# a second, independent mutex and an un-migrated cron entry would take that one
# while the dispatcher took this one. Both would then run. There is no
# transitional safety here, which is why migration is a start-up prerequisite.
#
# NOT under /var/lib/qf-platform: StateDirectory= creates that as qfd:qfd mode
# 0750, so the deploy user could not traverse into it. qf-locks is its own 0755
# directory for exactly that reason.
#
# qfheavy, NOT qfclient: qfclient contains research, and a group-writable lock in
# it would let the untrusted agent hold the mutex indefinitely and stop nightly
# training, with no job involved and therefore no timeout to save it.
#
# intent.d is 2770 -- SETGID, and that bit is load-bearing rather than
# decorative: without it a marker's group comes from the deploy user's primary
# group, which qfd is not in, so it could not read the declaration and would
# admit straight through it.
#
# Setgid is HALF the mechanism, and an earlier version of this comment claimed it
# was all of it -- that it also fixed the marker's MODE. It does not: setgid sets
# the group and nothing else, so under `umask 077` a marker is 0600 and group
# membership buys nothing. The other half is the publisher:
# daily_walk_forward.sh writes a temp file, `chmod 0640`s it and `mv`s it into
# place, which is what makes the mode independent of whatever umask the nightly
# inherited. NC8 clauses (h1) and (h2) assert both halves separately, because a
# test written from the overstated version failed on a correctly configured host.
#Type Path                                    Mode UID  GID     Age Argument
d     /var/lib/qf-locks                       0755 root root    -   -
f     /var/lib/qf-locks/heavy-training.lock   0660 root qfheavy -   -
d     /var/lib/qf-locks/intent.d              2770 root qfheavy -   -
