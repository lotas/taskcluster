# systemd-tmpfiles: the staging root the dispatcher writes and the evaluator
# reads. Phase 2c Task 24. Installed to /etc/tmpfiles.d/ by phase2c-setup.sh.
#
# WHY THIS IS NOT `StateDirectory=qf-eval` IN THE UNIT. It was, and it could not
# work: `StateDirectory=` creates the directory owned by the unit's own
# User:Group, so /var/lib/qf-eval would be `qfeval:qfeval 0750` -- and the
# process that has to create `<run_id>/in/` inside it is `qfd`, a different uid
# with no write access to it. The evaluator would have started cleanly, its
# startup gate would have reported every store correct, and the first evaluation
# would have failed in the dispatcher on `mkdir`.
#
# TWO OWNERS, ONE DIRECTORY, AND THAT IS THE POINT (D28). `qfd` owns it because
# `qfd` stages the one untrusted input; `qfeval` is the group because the
# evaluator must traverse in to read that input and write its own output. The
# candidate's user, `research`, is neither, and `0` for other is what keeps a
# verdict out of its reach.
#
# SETGID IS LOAD-BEARING, exactly as it is for qf-locks/intent.d, and here it
# carries one more step than it does there. A file created in a setgid directory
# takes the DIRECTORY's group, so with `2770 qfd qfeval` every per-run
# subdirectory, and the staged `predictions.parquet` inside it, is in the
# evaluator's group without `qfd` being a member of it -- and `qfd` must not need
# to be: Linux allows `chown(-1, gid)` only for a member of that group, so
# without the inheritance the dispatcher could not give the file away at all.
# `_stage_predictions` re-applies `2750`/`2770` to the per-run directories for
# the same reason, and `_give_to_the_evaluator` refuses if the group is wrong and
# it cannot fix it -- because the alternative is staging a file the evaluator
# cannot open, which reports one domain away from its cause.
#
# NO Age. Entries here are pruned by the run pruner's own policy (D9), not by
# tmpfiles: a verdict disappearing because a timer decided it was old, while the
# job row that cites it remains, is the kind of dangling reference this system
# spends its effort avoiding.
#Type Path              Mode UID GID    Age Argument
d     /var/lib/qf-eval  2770 qfd qfeval -   -
