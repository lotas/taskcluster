[project]
name = "queue-forecasting-trainer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "lightgbm>=4.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "psycopg[binary]>=3.2.0",
    "pyyaml>=6.0.0",
    "onnxmltools>=1.12.0",
    "onnxconverter-common>=1.14.0",
    "onnx>=1.15.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.5.0",
    "onnxruntime>=1.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
