target: wait_time
target_column: wait_duration_s

lookback_days: 14
holdout_days: 5
validation_days: 1
as_of_date: null

filters:
  - "r.started_at IS NOT NULL"
  - "r.queue_pending IS NOT NULL"
  - "r.wait_duration_s IS NOT NULL"
  - "r.wait_duration_s >= 0"

# Deliberately omits every capacity-touching feature (categorical
# capacity_null_reason; numeric running_workers/existing_capacity/
# claimed_tasks/capacity_sample_age_s/pending_total_per_capacity/
# running_per_capacity/pending_higher_or_equal_per_capacity) that qctx_a/b/c
# all carry. Ablation (2026-07) found qctx_b (capacity+priority) clearly beats
# qctx_a (capacity alone), but qctx_c (capacity+priority+flow) is statistically
# indistinguishable from qctx_b -- and wait_time_residual_throughput_filtered_baseline_qctx
# (everything, on the production baseline) is WORSE than isolating priority or
# flow alone. That pattern is consistent with capacity actively diluting the
# model rather than just being inert dead weight. This config tests
# priority+flow WITHOUT capacity, to see whether dropping it recovers/beats
# qctx_b/qctx_c's guarded 30m+ wait p90 miss (34.78%/34.92% over 15 cohorts).
categorical_features:
  - task_queue_id
  - scheduler_id
  - priority_at_pending
  - tags.kind
  - tags.os
  - tags.project
  - tags.worker-implementation

# New numeric features — LightGBM will ignore any that are all-NaN,
# so safe to list all windows even if some are sparse.
numeric_features:
  - queue_pending
  - max_run_time_s
  - hour_sin
  - hour_cos
  - day_sin
  - day_cos
  - bl_wait_p50
  - bl_wait_p90
  - queue_tasks_started_15m
  - queue_tasks_completed_15m
  - queue_avg_wait_15m
  - queue_avg_run_time_15m
  - queue_tasks_started_60m
  - queue_tasks_completed_60m
  - queue_avg_wait_60m
  - queue_avg_run_time_60m
  # Queue-context features (coverage step) -- backlog_coverage_ratio is
  # queue_pending-derived, not capacity-derived (computed before capacity
  # attach in queue_context.py), so it stays even with capacity dropped.
  - backlog_coverage_ratio
  # Queue-context features (priority-ahead step)
  - pending_higher_priority_same_queue
  - pending_same_priority_same_queue
  - pending_lower_priority_same_queue
  - oldest_higher_or_equal_pending_age_same_queue
  # Queue-context features (flow step)
  - arrivals_15m_same_queue
  - arrivals_60m_same_queue
  - arrivals_higher_or_equal_15m_same_queue
  - arrivals_higher_or_equal_60m_same_queue
  - starts_higher_or_equal_15m_same_queue

derived_features:
  cyclical_time:
    source: pending_at

model_type: lightgbm
quantiles: [0.5, 0.9]
model_params:
  num_leaves: 63
  learning_rate: 0.05
  n_estimators: 500
  early_stopping_rounds: 20
  min_data_in_leaf: 100

residual:
  baseline_file: baseline_predictions.ndjson
  baseline_feature: bl_wait_p50
  transform: log_ratio

throughput_features:
  enabled: true
  windows_minutes: [15, 60]

queue_context_features:
  enabled: true
  version: 1

baseline_dir: data/baseline_filtered

anomaly_filter:
  enabled: true
  mode: baseline            # Policy B: exclude anomalous days from baseline percentile history
  # flag_subset: omitted    # use any of the flags
