services:
  postgres:
    image: postgres:15
    # /dev/shm backs Postgres' dynamic shared memory (parallel-query workers).
    # Baseline regeneration fans out ~12 concurrent parallel aggregations
    # (predictor.js loadBulkStats*ForCutoff), whose combined DSM peaked past 2gb
    # and hit "could not resize shared memory segment: No space left on device".
    # The box has ~25Gi free RAM and tmpfs only consumes what's used, so give it
    # headroom. Pair with max_parallel_workers_per_gather below if it recurs.
    shm_size: "6gb"
    # Memory tuning — stock PG15 defaults (work_mem=4MB, shared_buffers=128MB)
    # are sized to boot anywhere, not for this 30GB box. The tiny work_mem made
    # the live-predictor's per-prediction throughput join spill to pgsql_tmp on
    # nearly every run (sustained temp-file churn). These raise the routine
    # ceilings; the trainer's heavy batch queries set a larger work_mem
    # per-session instead (see trainer/src/data_loader.py) to avoid the
    # per-connection × max_connections multiplier.
    command:
      - postgres
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=16GB
      - -c
      # Default is 2; the trainer's reference-run queries now legitimately scan
      # ~half of the (60-day-retention-capped) task_runs/tasks tables per cohort
      # (confirmed via EXPLAIN — a bound helped but this is still a big seq scan,
      # not a missing-index problem). Box has 8 cores and the trainer container
      # is I/O-waiting on this query, not competing for CPU, so give it more
      # workers. shm_size=6gb already has headroom for the extra DSM.
      - max_parallel_workers_per_gather=4
    # Observed steady-state ~9.2-9.4GB; cap well above that so a runaway query
    # can't starve the rest of the box, but this container's own cgroup gets
    # OOM-killed (visible, restartable) instead of the whole VM thrashing.
    # oom_score_adj protects it relative to trainer if the kernel-level OOM
    # killer ever has to choose outside any single container's own limit —
    # losing Postgres mid-write is worse than losing a resumable training run.
    mem_limit: "14g"
    oom_score_adj: -500
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: forecasting
      POSTGRES_HOST_AUTH_METHOD: trust
      LC_COLLATE: en_US.UTF8
      LC_CTYPE: en_US.UTF8
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      # NOTE: init.sql only runs on first volume creation.
      # To apply schema changes, run: docker compose down -v && docker compose up -d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres
      interval: 3s
      timeout: 4s
      retries: 100
      start_period: 3s

  collector:
    build:
      context: ../..
      dockerfile: tools/queue-forecasting/Dockerfile
    command: ["node", "src/collector.js"]
    # Observed steady-state ~200-360MB; generous cap as defense-in-depth.
    mem_limit: "2g"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s
    restart: unless-stopped
    profiles:
      - collector
      - full
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/forecasting
    volumes:
      - ./src:/app/tools/queue-forecasting/src
      - ./scripts:/app/tools/queue-forecasting/scripts

  predictor:
    build:
      context: ../..
      dockerfile: tools/queue-forecasting/Dockerfile
    # command: ["node", "src/diagnose.js"]
    command: ["node", "src/predictor.js", "--date", "${PREDICT_DATE:-2026-04-20}"]
    # Baseline export buffers many days x hundreds-of-thousands of rows before
    # writing NDJSON; give more headroom than the other lightweight Node services.
    # postgres (14g) + live-predictor (3g) + this (6g) = 23g concurrent worst
    # case, comfortably under the box's ~29.4GB physical RAM -- trainer (12g)
    # runs at a different point in daily_walk_forward.sh, not concurrently
    # with this container's baseline-export step.
    mem_limit: "6g"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - predictor
      - full
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/forecasting
      # V8's default old-space ceiling is ~2GB regardless of the container's
      # mem_limit above -- observed live as repeated "Reached heap limit ...
      # 2040ish MB" crashes at wildly different cumulative row counts (2.44M,
      # 4.76M, 2.23M), the signature of hitting a fixed ceiling rather than a
      # size-proportional one. Deliberately kept well BELOW mem_limit (~75%),
      # not equal to it: if this ever equaled mem_limit, V8's non-heap
      # overhead (young-gen space, code space, native/off-heap buffers from
      # the pg driver) would push RSS past the cgroup limit and the KERNEL
      # would silently SIGKILL the container -- worse than the clean "FATAL
      # ERROR: Reached heap limit" this setup is meant to surface instead.
      NODE_OPTIONS: "--max-old-space-size=4608"
    volumes:
      - ./src:/app/tools/queue-forecasting/src
      # Mount the whole trainer/data tree so any baseline_dir variant (default
      # `data/baseline`, Policy B/C `data/baseline_filtered`, etc.) is visible
      # to the predictor when it generates per-day JSONs or the aggregate
      # residual NDJSON.
      - ./trainer/data:/app/tools/queue-forecasting/trainer/data

  live-predictor:
    build:
      context: ../..
      dockerfile: tools/queue-forecasting/Dockerfile
    command: ["node", "src/live-predictor/index.js"]
    # Production-facing; cap as defense-in-depth but protect it from the
    # kernel OOM killer like Postgres — an outage here means missed predictions.
    mem_limit: "3g"
    oom_score_adj: -500
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 10s
    restart: unless-stopped
    profiles:
      - live-predictor
      - full
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/forecasting
    volumes:
      - ./src:/app/tools/queue-forecasting/src
      - ./trainer/data:/app/tools/queue-forecasting/trainer/data:ro

  trainer:
    build:
      context: ../..
      dockerfile: tools/queue-forecasting/trainer/Dockerfile
    # Was 12g (observed peak ~9.4-9.6GB for a single run at the time). Raised
    # to 18g 2026-07-15 after run_duration_residual OOM-killed twice at the
    # 12g ceiling (anon-rss ~11.6-11.8GB) -- then OOM-killed AGAIN at 18g
    # (anon-rss ~17.5GB) on a run that predated the features.py tags.*
    # categorical downcast fix (9 tags.* columns for this config alone,
    # previously all object dtype). Raised again to 22g alongside shipping
    # that fix, rather than gambling the fix alone clears 18g on the next
    # attempt -- each failed attempt costs a real ~15-20min SQL-fetch replay.
    # ~4.2GB actual usage of everything else combined (per `docker stats`)
    # leaves room on this box's ~29.4GB physical RAM (22g + ~4.5g others
    # concurrent ~= 26.5g, ~3GB slack). If this OOMs again even with the
    # categorical fixes deployed, that's a real leak or a genuine data-volume
    # jump worth profiling directly rather than raising the number a third
    # time. The cap's PURPOSE is still bounding a runaway or an accidental
    # second concurrent run so IT gets OOM-killed (visible, resumable via
    # manifest-skip) instead of the whole VM thrashing (2026-07 incidents: 3
    # concurrent trainers exceeded physical RAM + swap and froze the host,
    # twice) -- raising the number doesn't change that defense, it just stops
    # single-run false positives. oom_score_adj makes this the first thing
    # sacrificed if the kernel OOM killer has to choose outside any single
    # container's cap.
    mem_limit: "22g"
    oom_score_adj: 200
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - trainer
      - full
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/forecasting
    volumes:
      - ./trainer:/app/trainer
    entrypoint: ["uv", "run", "python", "-m", "src.train"]
    working_dir: /app/trainer

  worker-counter:
    build:
      context: ../..
      dockerfile: tools/queue-forecasting/Dockerfile
    command: ["node", "src/worker-counter.js"]
    mem_limit: "2g"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 10s
    restart: unless-stopped
    profiles:
      - worker-counter
      - full
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/forecasting
    volumes:
      - ./src:/app/tools/queue-forecasting/src

  dashboard-gen:
    build:
      context: ../..
      dockerfile: tools/queue-forecasting/Dockerfile
    command: ["node", "src/dashboard-gen.js"]
    mem_limit: "2g"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 10s
    restart: unless-stopped
    profiles:
      - dashboard
      - full
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/forecasting
      DASHBOARD_OUTPUT_DIR: /dashboard
      DASHBOARD_INTERVAL_MS: "900000"
    volumes:
      - ./src:/app/tools/queue-forecasting/src
      - ./trainer/data:/app/tools/queue-forecasting/trainer/data:ro
      - ./trainer-phase2-decision.md:/app/tools/queue-forecasting/trainer-phase2-decision.md:ro
      - ./walk_forward_summary.csv:/app/tools/queue-forecasting/walk_forward_summary.csv:ro
      - dashboard-html:/dashboard

  dashboard:
    image: nginx:alpine
    mem_limit: "512m"
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - dashboard-html:/usr/share/nginx/html:ro
    restart: unless-stopped
    profiles:
      - dashboard
      - full
    depends_on:
      - dashboard-gen

  health-monitor:
    build:
      context: ../..
      dockerfile: tools/queue-forecasting/trainer/Dockerfile
    entrypoint: ["uv", "run", "python", "-m", "scripts.compute_daily_health_loop"]
    working_dir: /app/trainer
    mem_limit: "3g"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 10s
    restart: unless-stopped
    profiles:
      - health-monitor
      - full
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/forecasting
      HEALTH_INTERVAL_SECONDS: "3600"
      HEALTH_LOOKBACK_DAYS: "7"
    volumes:
      - ./trainer:/app/trainer

  retention:
    build:
      context: ../..
      dockerfile: tools/queue-forecasting/Dockerfile
    command: ["node", "src/retention.js"]
    mem_limit: "2g"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 10s
    restart: unless-stopped
    profiles:
      - retention
      - full
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/forecasting
      RETENTION_DAYS: "60"
      RETENTION_INTERVAL_SECONDS: "86400"
    volumes:
      - ./src:/app/tools/queue-forecasting/src

volumes:
  pgdata:
  dashboard-html:
